# Kubernetes client configuration
k8s:
  # Path to kube-config file (required outside cluster)
  kube-config: "/opt/astron-xmod-shim/conf/shimlets/kubeconfig"
  # Client QPS limit
  qps: 20.0
  # Maximum burst requests allowed
  burst: 40
  # Request timeout in seconds
  timeout: 30

# HTTP server configuration
server:
  # Listening address (format: ":port" or "IP:port")
  port: ":7777"

# Log configuration
log:
  # Log level (debug/info/warn/error)
  level: "debug"
  # Log file output path
  path: "./logs/app.log"
  # Maximum size of single log file in MB
  max-size: 100
  # Log file retention days
  max-age: 7
  # Whether to compress archived logs
  compress: false
  # Whether to show code line numbers in logs
  show-line: true
  # Whether to output logs to console
  enable-console: true

# Currently active shimlet
current-shimlet: "k8s"

# Shimlet configurations
shimlets:
  k8s:
    config-path: "/opt/astron-xmod-shim/conf/shimlets/k8s-shimlet.yaml"  # Plugin configuration path
  docker:
    config-path: "./conf/docker/docker-shimlet.yaml"
  shimmy:
    config-path: "./conf/shimmy/shimmy-shimlet.yaml"

model-manage:
  model-root: "/mnt/maasmodels/"

# Tracer configuration
tracer:
  # Tracer polling interval in seconds
  interval: 30